[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "task-dependency-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0,<1.0.0",
    "uvicorn[standard]>=0.29.0,<1.0.0",
    "motor>=3.4.0,<4.0.0",
    "redis[asyncio]>=5.0.0,<6.0.0",
    "aiokafka>=0.11.0,<1.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "pydantic-settings>=2.0.0,<3.0.0",
    "python-json-logger>=3.0.0,<4.0.0",
    "slowapi>=0.1.9,<0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.23.0,<1.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "httpx>=0.27.0,<1.0.0",
    "pylint>=3.0.0,<4.0.0",
    "mypy>=1.10.0,<2.0.0",
    "fakeredis>=2.0.0,<3.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: fast, no I/O, no external services",
    "integration: requires the FastAPI test client",
]

[tool.coverage.run]
source = ["app"]

[tool.mypy]

[[tool.mypy.overrides]]
module = ["aiokafka.*", "motor.*", "pymongo.*", "slowapi.*", "pythonjsonlogger.*"]
ignore_missing_imports = true

[tool.pylint.messages_control]
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "too-few-public-methods",   # Protocol classes legitimately have one method
    "import-outside-toplevel",  # Used intentionally in configure_logging for optional dep
]